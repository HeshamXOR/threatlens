<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 130" width="520" height="130" role="img" aria-label="threatlens">
  <defs>
    <linearGradient id="tl-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8F4D"/>
      <stop offset="55%" stop-color="#FA5F02"/>
      <stop offset="100%" stop-color="#C83A00"/>
    </linearGradient>
    <radialGradient id="tl-glass" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#1A1A1D"/>
      <stop offset="100%" stop-color="#0C0C0D"/>
    </radialGradient>
  </defs>

  <!-- Lens mark: a magnifier whose reticle doubles as a crosshair over a threat -->
  <g transform="translate(65 65)">
    <!-- handle -->
    <line x1="30" y1="30" x2="52" y2="52" stroke="url(#tl-ring)" stroke-width="12" stroke-linecap="round"/>
    <!-- lens body -->
    <circle cx="0" cy="0" r="38" fill="url(#tl-glass)" stroke="url(#tl-ring)" stroke-width="7"/>
    <!-- reticle / crosshair -->
    <line x1="-38" y1="0" x2="-14" y2="0" stroke="#FA5F02" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <line x1="14" y1="0" x2="38" y2="0" stroke="#FA5F02" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <line x1="0" y1="-38" x2="0" y2="-14" stroke="#FA5F02" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <line x1="0" y1="14" x2="0" y2="38" stroke="#FA5F02" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <!-- the "threat" caught in the lens: a small pinned diamond -->
    <rect x="-9" y="-9" width="18" height="18" rx="2.5" transform="rotate(45)" fill="none" stroke="#FF2D55" stroke-width="3"/>
    <circle cx="0" cy="0" r="3" fill="#FF2D55"/>
  </g>

  <!-- Wordmark -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="700">
    <text x="132" y="76" font-size="46" fill="#FAFAFA" letter-spacing="-1">threat<tspan fill="#FA5F02">lens</tspan></text>
    <text x="134" y="100" font-size="14.5" fill="#9A9AA3" font-weight="500" letter-spacing="0.5">malicious URL &amp; executable detection</text>
  </g>
</svg>
